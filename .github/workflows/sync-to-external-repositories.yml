name: sync to external repositories
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

permissions:
  contents: read

jobs:
  sync-to-external-repositories:
    strategy:
      fail-fast: false
      matrix:
        repository:
          - swift-dns/swift-tiny-sequence
          - swift-dns/swift-idna
          - swift-dns/swift-endpoint
          - swift-dns/swift-dns

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      PR_BODY_FILE: pr-body.md
      SYNC_BRANCH: sync-files

    steps:
      - name: Generate swift-dns-helper token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SWIFT_DNS_HELPER_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_DNS_HELPER_PRIVATE_KEY }}
          owner: swift-dns

      - name: Check out ${{ github.repository }}
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out ${{ matrix.repository }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          path: ${{ matrix.repository }}
          persist-credentials: false

      - name: Mirror root-dir into ${{ matrix.repository }}
        run: rsync --archive --verbose source/root-dir/ ${{ matrix.repository }}/

      - name: Build pull request description
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          HEAD_SHA: ${{ github.sha }}
          SOURCE_PATH: source
          TARGET_PATH: ${{ matrix.repository }}
          MIRROR_SUBDIR: root-dir
          COMMIT_LIMIT: "20"
          OUTPUT_FILE: ${{ env.PR_BODY_FILE }}
        run: |
          source/.github/scripts/build-pr-description.sh

      - name: Resolve short commit SHA
        id: short-sha
        run: printf 'value=%s\n' "${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

      - name: Resolve ${{ matrix.repository }} base branch
        id: base
        env:
          TARGET_PATH: ${{ matrix.repository }}
        run: |
          printf 'branch=%s\n' "$(git -C "${TARGET_PATH}" rev-parse --abbrev-ref HEAD)" >> "${GITHUB_OUTPUT}"
          printf 'sha=%s\n' "$(git -C "${TARGET_PATH}" rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Create signed sync commit
        id: sync-commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ matrix.repository }}
          BRANCH: ${{ env.SYNC_BRANCH }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          COMMIT_MESSAGE: "Sync files from ${{ github.repository }}@${{ github.sha }}"
          WORK_DIR: ${{ matrix.repository }}
        run: |
          export OUTPUT_FILE="${GITHUB_OUTPUT}"

          source/root-dir/.github/scripts/commit-signed.sh

      - name: Reconcile the sync pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ matrix.repository }}
          HEAD_BRANCH: ${{ env.SYNC_BRANCH }}
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
          HAS_CHANGES: ${{ steps.sync-commit.outputs.has-changes }}
          TITLE: "Sync files from ${{ github.repository }}@${{ steps.short-sha.outputs.value }}"
          BODY_FILE: ${{ env.PR_BODY_FILE }}
        run: |
          source/.github/scripts/sync-pull-request.sh
